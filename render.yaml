services:
  - type: web
    name: construction-erp-api
    runtime: node
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: corepack enable && corepack prepare pnpm@10.14.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @erp/shared build && pnpm --filter @erp/api build
    startCommand: pnpm --filter @erp/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: https://shadi2234-1qjx8rvu4-shadfi.vercel.app
      - key: INITIAL_ADMIN_NAME
        value: System Administrator
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_LOCALE
        value: ar
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: construction-erp/uploads
      - key: CLOUDINARY_BACKUP_FOLDER
        value: construction-erp/backups
      - key: BACKUP_AUTO_ENABLED
        value: true
      - key: BACKUP_DAILY_TIME
        value: 02:00
      - key: BACKUP_RETENTION_DAYS
        value: 30
