services:
  api:
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: file:./dev.db
      JWT_ACCESS_SECRET: change-this-access-secret
      JWT_REFRESH_SECRET: change-this-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost:5173
      BACKUP_AUTO_ENABLED: "false"
      BACKUP_DAILY_TIME: "02:00"
      BACKUP_RETENTION_DAYS: "30"
    command: sh -c "pnpm --filter @erp/shared build && pnpm --filter @erp/api prisma:generate:sqlite && pnpm --filter @erp/api prisma:push:sqlite && pnpm --filter @erp/api dev"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    ports:
      - "4000:4000"

  web:
    environment:
      VITE_API_URL: http://localhost:4000
    command: sh -c "pnpm --filter @erp/shared build && pnpm --filter @erp/web dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  api_node_modules:
  web_node_modules:
